<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Star-Crossed</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Playfair+Display:ital,wght@0,600;0,800;1,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <p class="eyebrow">HOLLYWOOD LOVE ATLAS</p>
      <h1>Star-<em>Crossed</em></h1>
      <p class="intro">Pick a star to reveal a famous love story.</p>

      <section class="sky" id="sky" aria-label="Celebrity couple stars"></section>

      <section class="reveal" id="reveal" aria-live="polite">
        <span class="spark">✦</span>
        <p class="hint">Your next celebrity timeline is waiting in the stars.</p>
      </section>

      <p class="note">Dates reflect widely reported public milestones, not private relationship histories.</p>
    </main>
    <script src="app.js"></script>
  </body>
</html>
